name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest Unit Tests
      run: npm test

  web-test:
    name: Web E2E
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Web E2E Tests
      run: npm run web:test:ci

  electron-test:
    name: Electron E2E
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Electron E2E Tests
      env:
        ELECTRON_DISABLE_SANDBOX: '1'
      run: xvfb-run -a npm run test:electron

  build:
    name: Build Application
    runs-on: ${{ matrix.os }}
    needs: [lint, unit-test, web-test, electron-test]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Electron app
      run: npm run build

    - name: Prepare dmg-builder bundle for macOS
      if: matrix.os == 'macos-15-intel'
      run: |
        mkdir -p .ci/dmgbuild
        curl -L \
          -o .ci/dmgbuild/dmgbuild-bundle-x86_64-75c8a6c.tar.gz \
          https://github.com/electron-userland/electron-builder-binaries/releases/download/dmg-builder@1.2.0/dmgbuild-bundle-x86_64-75c8a6c.tar.gz
        tar -xzf .ci/dmgbuild/dmgbuild-bundle-x86_64-75c8a6c.tar.gz -C .ci/dmgbuild
        chmod +x .ci/dmgbuild/dmgbuild
        echo "CUSTOM_DMGBUILD_PATH=${GITHUB_WORKSPACE}/.ci/dmgbuild/dmgbuild" >> $GITHUB_ENV

    - name: Build distribution (macOS x64)
      if: matrix.os == 'macos-15-intel'
      run: npx electron-builder --mac dmg --x64 --publish never

    - name: Build distribution
      if: matrix.os != 'macos-15-intel'
      run: npm run dist

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: patterm-${{ matrix.os }}
        path: dist/
        retention-days: 7
        if-no-files-found: ignore

  deploy-web:
    name: Deploy Web PWA
    runs-on: ubuntu-latest
    needs: [unit-test, web-test, electron-test, build]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Web App
      run: npm run web:build

    - name: Check Cloudflare deployment secrets
      id: cloudflare-secrets
      run: |
        if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
          echo "configured=true" >> $GITHUB_OUTPUT
        else
          echo "configured=false" >> $GITHUB_OUTPUT
        fi

    - name: Skip Cloudflare Pages deploy when secrets are unavailable
      if: steps.cloudflare-secrets.outputs.configured != 'true'
      run: echo "Cloudflare Pages deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."

    - name: Deploy to Cloudflare Pages
      if: steps.cloudflare-secrets.outputs.configured == 'true'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: npx wrangler@4 pages deploy web/dist --project-name=patterm

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, unit-test, web-test, electron-test, deploy-web]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Merge artifacts into dist directory
      run: |
        mkdir -p dist
        find artifacts -type f -name "*.exe" -exec cp {} dist/ \;
        find artifacts -type f -name "*.dmg" -exec cp {} dist/ \;
        find artifacts -type f -name "*.AppImage" -exec cp {} dist/ \;
        find artifacts -type f -name "*.deb" -exec cp {} dist/ \;
        ls -la dist/

    - name: Extract version from tag
      id: extract_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Release v${{ steps.extract_version.outputs.version }}
        files: dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
